<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — CubeCAD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="stage" id="stage">

  <!-- Barre d'outils -->
<header class="toolbar">
  <span class="toolbar__logo">▣ <b>GDLT</b></span>
  <nav class="toolbar__views" id="viewButtons"></nav>
  <div class="contacts mono" id="contacts"></div>
  <span class="toolbar__file mono">accueil.htm</span>
</header>

  <div class="contacts mono" id="contacts"></div>

  <div class="scene">
    <div class="grid-floor"></div>
    <div class="cube" id="cube"></div>
  </div>

  <div class="viewlabel mono" id="hudPath">ISO</div>

  <!-- Trièdre -->
<svg class="triad" id="triadSvg" viewBox="0 0 100 100" aria-hidden="true"></svg>

  <!-- Barre d'état -->
  <footer class="statusbar mono">
    <span id="sbPhase">ISO</span>
    <span id="sbRot">RX +0.0°  RY +0.0°</span>
    <span>←/→ : vues · molette : rotation</span>
  </footer>

</main>

<nav class="tree" id="tree" aria-label="Arbre de conception"></nav>
<div class="scroll-space" id="scrollSpace"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
