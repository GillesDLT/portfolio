<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — CubeCAD</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/main.css">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<main class="stage" id="stage">

  <header class="toolbar">
    <span class="toolbar__logo">▣ <b>GDLT</b></span>
    <nav class="toolbar__views" id="viewButtons"></nav>
    <div class="contacts mono" id="contacts"></div>
    <span class="toolbar__file mono">accueil.htm</span>
  </header>

  <canvas id="cad3d"></canvas>
  <div id="cad-annos"></div>

  <div class="viewlabel mono" id="hudPath">ISO</div>
  <svg class="triad" id="triadSvg" viewBox="0 0 100 100" aria-hidden="true"></svg>

  <footer class="statusbar mono">
    <span id="sbPhase">ISO</span>
    <span id="sbRot">RX +0.0°&nbsp; RY +0.0°</span>
    <span>←/→ : vues · molette : rotation</span>
  </footer>

</main>

<nav class="tree" id="tree" aria-label="Arbre de conception"></nav>
<div class="scroll-space" id="scrollSpace"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
