      <rect x="0" y="54" width="220" height="7" rx="3.5" fill="#d0d8e2"/>
      <rect x="0" y="71" width="233" height="7" rx="3.5" fill="#d0d8e2"/>
      <rect x="0" y="88" width="186" height="7" rx="3.5" fill="#d0d8e2"/>
      <rect x="0" y="117" width="230" height="1" fill="#d8e0ea"/>
      <text x="0" y="146" fill="#3978d7" font-family="Arial,sans-serif" font-size="13" font-weight="700">LISIBILITÉ · RIGUEUR · ÉQUILIBRE</text>
