    <text x="64" y="74" fill="#5276a6" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">NOTE TECHNIQUE · 01</text>
    <text x="64" y="134" fill="#17263c" font-family="Georgia,serif" font-size="36" font-weight="700">Concevoir avec précision</text>
    <text x="64" y="171" fill="#697991" font-family="Arial,sans-serif" font-size="16">Une mise en page au service des idées.</text>
    <rect x="64" y="202" width="500" height="1" fill="#d8e0ea"/>
    <text x="64" y="246" fill="#23344b" font-family="Arial,sans-serif" font-size="17" font-weight="700">1. Une structure claire</text>
    <rect x="64" y="264" width="492" height="8" rx="4" fill="#b9c5d4"/>
    <rect x="64" y="282" width="454" height="8" rx="4" fill="#d0d8e2"/>
    <rect x="64" y="300" width="475" height="8" rx="4" fill="#d0d8e2"/>
    <rect x="64" y="318" width="332" height="8" rx="4" fill="#d0d8e2"/>
    <g transform="translate(64 364)">
