      <path d="M34 137V36M34 137H199" fill="none" stroke="#8498b3" stroke-width="2"/>
      <path d="M44 119C69 105 72 66 102 78S146 99 184 42" fill="none" stroke="#3978d7" stroke-width="5" stroke-linecap="round"/>
