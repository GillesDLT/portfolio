<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustration de mise en page technique</title>
  <desc id="desc">Maquette graphique abstraite d’un document technique avec un titre, des paragraphes et un graphique.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9eff8"/><stop offset="1" stop-color="#cbd7e8"/></linearGradient>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f6fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#18263c" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="180" fill="#8db7f0" opacity=".2"/>
  <circle cx="120" cy="640" r="220" fill="#587fbd" opacity=".1"/>
  <g filter="url(#shadow)" transform="translate(280 55)">
